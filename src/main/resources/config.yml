debug: false
holograms: false
hologram-update-ticks: 40
convert-natural-spawners: true

digital:
  # Magic spawners never create real mobs. Drops are generated virtually.
  disable-physical-spawns: true

generation:
  interval-ticks: 200
  require-player-nearby: true
  activation-range: 24
  offline-generation: false
  loot-limit: -1

stacking:
  max-stack: 2000
  merge-on-place: true
  same-type-only: true

breaking:
  enabled: true
  # Crouch + Silk Touch to pick up a MagicSpawners block.
  require-sneaking: true
  silk-touch-required: true
  drop-chance: 100
  direct-to-inventory: true
  explosion-protection: true

storage:
  # Maximum total virtual item count held by one digital spawner.
  # The GUI shows current/max and the filled percentage under the page line.
  max-items: 125000
  max-slots: 45
  max-exp: 50000
  auto-sell: false

economy:
  enabled: true
  currency-symbol: "$"

performance:
  async-save: true
  save-interval-seconds: 300
  max-spawners-per-chunk: 32
  # Hard budget per generation pass. Keeps MSPT stable even with thousands of spawners.
  max-spawners-per-generation-run: 100
  # Do not force-load chunks just to process virtual spawners.
  skip-unloaded-chunks: true

bedrock:
  disable-holograms-for-bedrock: true
