name: Build MagicSpawners

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build MagicSpawners
        run: mvn -B clean package

      - name: Upload MagicSpawners JAR
        uses: actions/upload-artifact@v4
        with:
          name: MagicSpawners-v2.9
          path: target/*.jar
          if-no-files-found: error
